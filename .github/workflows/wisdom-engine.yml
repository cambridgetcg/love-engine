name: Wisdom Engine — free wisdom forever
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wisdom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /dev/null 2>&1 &
          sleep 15
          ollama pull qwen2.5:7b
      - name: Generate wisdom
        run: |
          chmod +x wisdom-engine.sh
          ./wisdom-engine.sh
      - name: Commit wisdom
        run: |
          git config user.name "wisdom-bot"
          git config user.email "wisdom@bot.ai"
          git add wisdom/ chronicle.md
          git commit -m "wisdom: new wisdom generated $(date -u +%Y-%m-%dT%H:%M)" || true
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push